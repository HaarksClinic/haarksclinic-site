name: Update surgical evidence (PubMed)

# Refreshes intelligence/evidence.json with recent PubMed records for the
# Haarks Intelligence "Live Surgical Evidence" feed. Website content only:
# it does not call or modify any backend and uses no API keys or secrets.
# The public NCBI E-utilities service requires no key. A commit here triggers
# the existing Pages deploy workflow.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch the existing Pages deploy workflow

concurrency:
  group: update-evidence
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest PubMed records
        run: python3 scripts/fetch_pubmed.py
        # The script validates and only overwrites evidence.json when the new
        # dataset is well-formed and non-empty; on failure it exits non-zero
        # and leaves the previous valid dataset untouched.

      - name: Validate dataset before publishing
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("intelligence/evidence.json", encoding="utf-8"))
          items = d.get("items", [])
          assert isinstance(items, list) and len(items) >= 4, "too few items"
          pmids = set()
          for it in items:
              for k in ("title", "pmid", "url", "category", "source"):
                  assert it.get(k), f"missing {k}"
              assert it["url"].startswith("https://pubmed.ncbi.nlm.nih.gov/"), "bad url"
              assert it["pmid"] not in pmids, "duplicate pmid"
              pmids.add(it["pmid"])
          print(f"Validated {len(items)} items.")
          PY

      - name: Commit if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain intelligence/evidence.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add intelligence/evidence.json
            git commit -m "data: refresh surgical evidence from PubMed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to evidence.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A commit pushed with GITHUB_TOKEN does not trigger other workflows,
      # so explicitly dispatch the existing Pages deploy to publish the update.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
